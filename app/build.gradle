apply plugin: 'com.android.application'

// 签名信息从根目录的 keystore.properties 读取，该文件不入库（见 .gitignore）。
// 找不到该文件时自动跳过签名，任何人都能 clone 下来直接编译（assembleRelease 产出未签名包）。
def keystorePropsFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystorePropsFile.withInputStream { stream -> keystoreProps.load(stream) }
}

android {
    compileSdkVersion 29
    signingConfigs {
        release {
            if (hasKeystore) {
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // 路径相对项目根目录
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
            }
        }
    }
    defaultConfig {
        resConfigs "zh"
        applicationId "com.omarea.gesture"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 105
        versionName "1.6.4-plus"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release_mini {
            shrinkResources true
            minifyEnabled true
            // debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable true
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle("[EdgeGesturePlus] 未找到 keystore.properties，将产出未签名的 release 包。")
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // signingConfig signingConfigs.release
            minifyEnabled false
            debuggable true
            jniDebuggable = false
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
repositories {
    mavenCentral()
}
